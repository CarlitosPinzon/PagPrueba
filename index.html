<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f7f8fc;
    color: #1a1a1a;
  }

  .wrap { padding: 2rem 1rem; max-width: 1000px; margin: 0 auto; }

  .header { text-align: center; margin-bottom: 2.5rem; }
  .title-tag {
    display: inline-block;
    background: #eef0ff;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 11px;
    color: #4a4a7a;
    margin-bottom: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .main-title { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { font-size: 14px; color: #666; }

  .selector {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }
  .sel-btn {
    padding: 8px 18px;
    font-size: 13px;
    border-radius: 999px;
    border: 1px solid #e0e3f0;
    background: white;
    color: #666;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .sel-btn:hover { background: #f0f2ff; }
  .sel-btn.active {
    background: #4a4ae6;
    border-color: #4a4ae6;
    color: white;
    font-weight: 500;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 18px;
  }

  .card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .card:hover { transform: translateY(-3px); }

  .card.featured {
    border: 1.5px solid #dcdcff;
  }

  .card-head { padding: 18px; }
  .card-badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 10px;
    background: #f0f2ff;
    color: #4a4ae6;
    display: inline-block;
    margin-bottom: 8px;
  }

  .best-badge {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 10px;
    background: #4a4ae6;
    color: white;
  }

  .card-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .card-desc { font-size: 13px; color: #666; }

  .amenities {
    padding: 12px 18px;
    border-top: 1px solid #f0f0f5;
    border-bottom: 1px solid #f0f0f5;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #f3f4f8;
    color: #555;
  }
  .tag.warn {
    background: #fff4e5;
    color: #8a5b00;
  }

  .price-block { padding: 18px; }

  .price-label {
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .price-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .price-config { font-size: 13px; color: #555; }
  .price-pp { font-size: 12px; color: #999; }

  .price-total {
    font-size: 18px;
    font-weight: 600;
  }

  .card-foot {
    padding: 14px 18px;
    background: #fafbff;
    border-top: 1px solid #f0f0f5;
  }

  .foot-label { font-size: 11px; color: #999; }
  .foot-range { font-size: 14px; font-weight: 600; }

  .note {
    text-align: center;
    margin-top: 2rem;
    font-size: 12px;
    color: #777;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }
</style>

<div class="wrap">
  <div class="header">
    <div class="title-tag">Plan de hospedaje</div>
    <h1 class="main-title">Comparativa de opciones</h1>
    <p class="subtitle">Precios reales en pesos colombianos · por persona</p>
  </div>

  <div class="selector">
    <button class="sel-btn active" onclick="setGroup(6)">6 personas</button>
    <button class="sel-btn" onclick="setGroup(7)">7 personas</button>
    <button class="sel-btn" onclick="setGroup(8, 'dobles')">8p · dobles</button>
    <button class="sel-btn" onclick="setGroup(8, 'mix')">8p · mix</button>
    <button class="sel-btn" onclick="setGroup(9)">9 personas</button>
  </div>

  <div class="cards" id="cards"></div>
  <p class="note" id="note"></p>
</div>

<script>
const data = {
  milan: {
    name: "Hotel Milán",
    label: "Milán",
    desc: "Incluye desayuno",
    tags: ["Desayuno incl.", "Centro"],
    prices: {
      "6": { pp: 220000, config: "1 pareja (hab. doble)" },
      "7": { pp: 220000, config: "2 parejas" },
      "8d": { pp: 235000, config: "Todas dobles" },
      "8m": { pp: 220000, config: "2 dobles + 1 cuádruple" },
      "9": null
    }
  },
  med: {
    name: "Hotel Mediterráneo",
    label: "Mediterráneo",
    desc: "Desayuno · Piscina · Más amplio",
    tags: ["Desayuno incl.", "Piscina", "Más grande"],
    featured: true,
    prices: {
      "6": { pp: 230000, config: "1 pareja (hab. doble)" },
      "7": { pp: 235000, config: "2 parejas" },
      "8d": { pp: 240000, config: "Todas dobles" },
      "8m": { pp: 232000, config: "1 doble + 1 cuádruple" },
      "9": null
    }
  },
  airbnb: {
    name: "Airbnb",
    label: "Airbnb",
    desc: "Casa completa",
    tags: ["Casa entera", "Cocina propia"],
    warnTags: ["Preparar desayuno"],
    prices: {
      "6": { pp: 265000, config: "Casa completa" },
      "7": { pp: 233000, config: "Casa completa" },
      "8d": { pp: 210000, config: "Casa completa" },
      "8m": { pp: 210000, config: "Casa completa" },
      "9": { pp: 195000, config: "Casa completa · máx. 9p" }
    }
  }
};

const groupKey = { 6: "6", 7: "7", "8,dobles": "8d", "8,mix": "8m", 9: "9" };

function fmt(n) { return n.toLocaleString('es-CO'); }

function setGroup(n, sub) {
  const key = sub ? `${n},${sub}` : String(n);
  const gkey = groupKey[key] || key;

  document.querySelectorAll('.sel-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  const persons = (gkey === "8d" || gkey === "8m") ? 8 : Number(n);

  const cards = document.getElementById('cards');
  cards.innerHTML = '';

  Object.entries(data).forEach(([id, hotel]) => {
    const p = hotel.prices[gkey];
    const card = document.createElement('div');
    card.className = 'card' + (hotel.featured ? ' featured' : '');

    let content = '';

    if (!p) {
      content = `<div style="padding:20px;text-align:center;color:#aaa;">No disponible</div>`;
    } else {
      const total = p.pp * persons;

      content = `
        <div class="price-block">
          <div class="price-label">${persons} personas</div>
          <div class="price-row">
            <div>
              <div class="price-config">${p.config}</div>
              <div class="price-pp">$${fmt(p.pp)} / persona</div>
            </div>
            <div class="price-total">$${fmt(p.pp)}</div>
          </div>
        </div>
        <div class="card-foot">
          <div class="foot-label">Total grupo</div>
          <div class="foot-range">$${fmt(total)}</div>
        </div>
      `;
    }

    const tagsHTML = (hotel.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
    const warnHTML = (hotel.warnTags || []).map(t => `<span class="tag warn">${t}</span>`).join('');

    card.innerHTML = `
      <div class="card-head">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="card-badge">${hotel.label}</span>
          ${hotel.featured ? '<span class="best-badge">Recomendado</span>' : ''}
        </div>
        <div class="card-name">${hotel.name}</div>
        <div class="card-desc">${hotel.desc}</div>
      </div>
      <div class="amenities">${tagsHTML}${warnHTML}</div>
      ${content}
    `;

    cards.appendChild(card);
  });

  document.getElementById('note').textContent =
    "Nota: Si hay habitaciones dobles, las parejas se alojan allí y las demás personas comparten una sola habitación.";
}

setGroup(6);
</script>
